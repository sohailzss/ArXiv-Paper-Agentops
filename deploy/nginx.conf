# Public entry point on EC2: password-protected (HTTP basic auth) proxy to the UI and the API.
# Password file: deploy/.htpasswd (created on the server, never committed).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Every /api/ call can cost LLM tokens: cap each client IP at 20 requests/minute (bursts of 10 allowed).
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 1m;
    server_tokens off;

    auth_basic "arXiv RAG Curator";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Shared proxy settings. Buffering off so streamed answers (server-sent events) arrive token by token.
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Unauthenticated liveness check (returns {"message": "pong"}, nothing sensitive).
    location = /api/v1/ping {
        auth_basic off;
        proxy_pass http://api:8000;
    }

    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://api:8000;
    }

    # FastAPI's interactive docs
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_pass http://api:8000;
    }

    # Gradio UI (needs WebSocket upgrade headers)
    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://ui:7860;
    }
}
